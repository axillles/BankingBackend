spring:
  twelvedata:
    api-key: ${TWELVEDATA_API_KEY}
    api-url: ${TWELVEDATA_API_URL:https://api.twelvedata.com}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: true
logging:
  level:
    com.bankingsystem.app.service.impl: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
security:
  jwt:
    secret-key: ${JWT_SECRET}
exchange-rates:
  scheduler:
    enabled: ${EXCHANGE_RATES_SCHEDULER_ENABLED:true}
